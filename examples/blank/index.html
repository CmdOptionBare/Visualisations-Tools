<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blank · Visualisations-Tools</title>
  <link rel="stylesheet" href="../../shared/hub.css">
  <style>
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.2rem;
    }
    .panel h2 { margin: 0 0 0.4rem; font-size: 1.2rem; }
    .panel p { margin: 0 0 0.75rem; color: var(--muted); }
    .panel p:last-child { margin-bottom: 0; }
    .panel code {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85rem;
      color: var(--accent);
    }
    .err { color: #f0a0a0; }
    .empty {
      margin: 0;
      padding: 0.85rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../">← Hub</a>
    <p class="brand">examples / blank</p>
    <h1>Blank starter</h1>
    <p class="lead">Empty-ish template: copy this folder, edit <code>./data/sample.json</code>, and render into <code>#out</code> with <code>loadJson</code>.</p>
    <div class="panel" id="out" aria-live="polite">Loading…</div>
  </div>
  <script type="module">
    import { loadJson } from "../../shared/load-json.js";

    const out = document.getElementById("out");
    try {
      const data = await loadJson("./data/sample.json");
      const items = Array.isArray(data.items) ? data.items : [];
      const body = items.length
        ? `<ul>${items.map((item) => `<li>${item}</li>`).join("")}</ul>`
        : `<p class="empty">No items yet — add entries to <code>data.items</code> in <code>./data/sample.json</code>.</p>`;

      out.innerHTML = `
        <h2>${data.title ?? "Untitled"}</h2>
        <p>${data.message ?? ""}</p>
        ${body}
      `;
    } catch (err) {
      out.innerHTML = `<p class="err">${err.message}</p>`;
    }
  </script>
</body>
</html>

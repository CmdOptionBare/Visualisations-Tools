<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualisierungen</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./shared/hub.css">
</head>
<body>
  <div class="portal">
    <header class="mast">
      <p class="brand">Visualisations-Tools</p>
      <h1>Visualisierungen</h1>
      <p class="lead">Graphen, Sprache, 3D-Modelle und Architektur. Die Suche und die Filter gelten für den ganzen Katalog, jede Seite zeigt höchstens zehn Treffer.</p>
    </header>

    <section class="controls" aria-label="Suche und Filter">
      <label class="search" for="search">
        <span class="search-label">Suche</span>
        <input id="search" type="search" placeholder="Name, Beschreibung oder Merkmal" autocomplete="off">
      </label>
      <div id="filters" class="filters"></div>
      <div class="control-row">
        <p id="count" class="count" aria-live="polite">Katalog wird geladen …</p>
        <button id="reset" type="button">Filter zurücksetzen</button>
      </div>
    </section>

    <p id="status" class="status" role="status" hidden></p>
    <p id="empty" class="empty" hidden>Keine Werkzeuge für diese Auswahl.</p>
    <div id="grid" class="grid"></div>

    <nav id="pager" class="pager" hidden aria-label="Seiten">
      <button id="prev" type="button">Zurück</button>
      <p id="page-label" class="page-label"></p>
      <button id="next" type="button">Weiter</button>
    </nav>
  </div>
  <script type="module" src="./shared/hub.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
